name: Bug Report
description: Report something that isn't working/broken.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit an issue! These improve the library and makes the overall experience much better. If you need any further assistance, consider joining our Discord server: https://discord.gg/6TNJHcGRYv
  - type: textarea
    attributes:
      label: Describe the bug
      description: A quick but concise description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal Reproducible Code
      description: A simplified but complete version of the code you used when the bug occurred. This is automatically converted into C# code, so there's no need for backticks.
      render: cs
    validations:
      required: true
  - type: textarea
    attributes:
      label: Traceback
      description: The entire traceback or "None" if no traceback was displayed.
      render: txt
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Comments
      description: Any additional comments can be posted here.
